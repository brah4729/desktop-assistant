<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Desktop Assistant</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent; /* important: lets the desktop show through */
        font-family: system-ui, sans-serif;
      }
      #scene {
        position: absolute; /* size and place are set by layoutAvatar() in renderer.js */
        display: block;
        cursor: grab; /* the mouse only reaches the canvas while it is over the avatar */
      }
      #ui {
        position: absolute;
        left: calc(50% - 192px); /* fixed width, centered: it does not change when the avatar is resized */
        width: 384px;
        bottom: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #bubble {
        display: none;
        max-height: 110px;
        overflow-y: auto;
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(20, 20, 28, 0.85);
        color: #f2f2f2;
        font-size: 13px;
        line-height: 1.4;
      }
      #row {
        display: flex;
        gap: 6px;
      }
      #input {
        flex: 1;
        padding: 8px 10px;
        border: none;
        outline: none;
        border-radius: 10px;
        background: rgba(20, 20, 28, 0.85);
        color: #fff;
        font-size: 13px;
      }
      #input::placeholder {
        color: #9aa;
      }
      #mic,
      #quit {
        width: 34px;
        border: none;
        border-radius: 10px;
        color: #fff;
        cursor: pointer;
      }
      #mic {
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(20, 20, 28, 0.85);
      }
      #mic svg {
        fill: currentColor;
        pointer-events: none;
      }
      #mic.listening {
        background: rgba(200, 40, 40, 0.95); /* red while the microphone is on */
      }
      #quit {
        background: rgba(120, 30, 30, 0.85);
      }
    </style>

    <!-- Tells the browser where to find "three" and "@pixiv/three-vrm" (installed by npm) -->
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/",
          "three/examples/jsm/": "./node_modules/three/examples/jsm/",
          "@pixiv/three-vrm": "./node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="ui">
      <div id="bubble"></div>
      <div id="row">
        <input id="input" type="text" placeholder="Talk to me..." autocomplete="off" />
        <button id="mic" title="Hold to talk (or Alt+Shift+Space: press to start, press again to stop)" aria-label="Hold to talk">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2z" />
          </svg>
        </button>
        <button id="quit" title="Quit (Ctrl+Shift+Q)">✕</button>
      </div>
    </div>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
